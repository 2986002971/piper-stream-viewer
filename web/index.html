<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piper Stream Viewer</title>
<style>
body{margin:0;background:#15191f;color:#eee;font:14px system-ui}header{display:flex;gap:12px;align-items:center;padding:10px}
button,a{color:inherit}button{background:#354253;border:0;border-radius:4px;padding:8px 16px;cursor:pointer}a{margin-left:auto}
main{width:100vw;height:calc(100vh - 60px);display:grid;place-items:center}
video{width:100%;height:100%;object-fit:contain;outline:none}#status{white-space:pre-wrap}
</style>
<script src="/transport.js"></script></head>
<body><header><strong id="mode"></strong><button id="connect">连接</button><button id="disconnect">断开</button>
<span id="status">准备连接</span><span id="video-status">等待视频</span><a id="switch" hidden>切换模式</a></header>
<main><video id="remote-video" autoplay muted playsinline tabindex="0"></video><audio id="remote-audio" autoplay></audio></main>
<script type="module" src="/src/main.ts"></script></body></html>
